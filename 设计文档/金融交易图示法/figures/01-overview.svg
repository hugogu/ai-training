<text x="150" y="160" font-size="18" text-anchor="middle" fill="#263746">规则、假设、分析边界</text>
<rect x="315" y="25" width="270" height="172" rx="8" fill="#d3f2da" stroke="#263746" stroke-width="1.5"/>
<text x="450" y="59" font-size="24" text-anchor="middle" fill="#263746">业务图</text>
<text x="450" y="96" font-size="18" text-anchor="middle" fill="#263746">账户与资金位置</text>
