<svg xmlns="http://www.w3.org/2000/svg" width="900" height="255" viewBox="0 0 900 255">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial Unicode MS, PingFang SC, Noto Sans CJK SC, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<rect x="15" y="25" width="270" height="172" rx="8" fill="#fff6c4" stroke="#263746" stroke-width="1.5"/>
<text x="150" y="59" font-size="24" text-anchor="middle" fill="#263746">场景卡</text>
